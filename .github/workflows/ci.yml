name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-suffix: py${{ matrix.python }}-${{ matrix.os }}
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      # The engine extra carries torch and numpy. Without it the offline suite
      # collects 20 import errors, because most of engine/ imports torch even in
      # tests that never touch a GPU. The first CI run failed exactly this way on
      # all 12 combinations, which is what CI is for.
      - name: Install locked project, engine extra, and development dependencies
        run: uv sync --frozen --extra engine --group dev --python ${{ matrix.python }}

      - name: Run complete offline suite
        run: >-
          uv run --no-sync python -m pytest
          -m "not gpu and not network and not weights"

  lint-and-package:
    name: lint and package
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: lint-package
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Install locked project, engine extra, and development dependencies
        run: uv sync --frozen --extra engine --group dev --python 3.13

      - name: Run Ruff
        run: uv run --no-sync ruff check .

      - name: Build distributions
        run: uv build

      - name: Verify typed wheel marker
        run: >-
          uv run --no-sync python -c
          "import glob, zipfile; wheel = glob.glob('dist/*.whl')[0];
          names = zipfile.ZipFile(wheel).namelist();
          assert 'k3/py.typed' in names, names"
